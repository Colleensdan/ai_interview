# Render deployment for the Task 2 codebook-improvement app.
#
# RAM-only / data-privacy: NO data is written to the container filesystem. The
# results DB lives only in process memory (AICODE_MEMORY_DB) and the single
# durable copy is in SharePoint (state/coding.sqlite + a readable state/csv
# mirror), hydrated at boot and flushed on every write by app/state_sync.py.
#
# IMPORTANT: exactly one instance. The old persistent disk implicitly pinned the
# service to a single instance; with the disk gone we pin it explicitly
# (numInstances: 1, no autoscaling) so two instances can never flush the shared
# blob concurrently. Prefer a recreate deploy over overlapping rolling deploys.
#
# PREREQUISITE: the Azure app registration must have Files.ReadWrite.All /
# Sites.ReadWrite.All (application) + admin consent, or write-back returns 403
# and the app degrades to read-only (see upload_test_data.py's 403 hint).
services:
  - type: web
    name: codebook-improvement
    runtime: python
    plan: starter
    rootDir: data_analysis        # the service runs from data_analysis/
    numInstances: 1               # single instance — see header note
    buildCommand: pip install -r requirements.txt
    # python -m guarantees the cwd is on sys.path (for `config`, `db`, `app`).
    # --workers 1 so the in-memory DB + job thread stay in one process.
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      # --- RAM-only: DB in memory, SharePoint is the durable store ---
      - key: AICODE_MEMORY_DB
        value: "1"
      # --- SharePoint source folder (configurable, not hardcoded) ---
      - key: AICODE_SHAREPOINT_DIR
        value: Test Data
      # Deployment name is not a secret — pin it so the live model matches the
      # data and isn't accidentally changed in the dashboard.
      - key: CJBS_DEPLOYMENT_NAME
        value: gpt-5-mini
      - key: PYTHON_VERSION
        value: "3.13.4"
      # --- secrets: set these in the Render dashboard (sync:false) ---
      - key: CJBS_API_KEY
        sync: false
      - key: CJBS_API_ENDPOINT
        sync: false
      - key: CJBS_API_VERSION
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: SP_HOSTNAME
        sync: false
      - key: SP_SITE_PATH
        sync: false
      - key: SP_LIBRARY_NAME
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true            # Render generates a strong random secret
      # --- future model keys (add when available) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
